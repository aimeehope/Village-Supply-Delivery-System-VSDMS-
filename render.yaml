services:
  - type: web
    name: vsdms-backend
    runtime: node
    plan: free
    branch: main
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: vsdms-db
          property: connectionString
      - key: JWT_SECRET
        sync: false

  - type: web
    name: vsdms-frontend
    runtime: node
    plan: free
    branch: main
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        sync: false

databases:
  - name: vsdms-db
    plan: free
    databaseName: vsdms
    user: vsdms_user
    region: oregon